name: Linear design bridge

# One tick of bridge/bridge.py: post results the routine pushed back, report runs that never came back, and fire the
# routine for open Product tickets that carry the ai-design label. Started by the Cloudflare relay (relay/worker.js)
# with mode=live, never on a GitHub schedule. A dispatch always runs main's code, so a result branch can never change
# what runs here.
# Kill switch for paid runs: the routine is fired only when the repo variable DESIGN_BRIDGE_FIRING is "on".
# A manual dispatch defaults to a dry run (reads Linear and GitHub, prints what it would do, writes nothing).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run writes nothing; live runs one real tick (fires the routine only if DESIGN_BRIDGE_FIRING is on)
        type: choice
        options: [dry-run, live]
        default: dry-run

concurrency:
  group: linear-design-bridge
  cancel-in-progress: false

permissions:
  contents: write # claim tags design-claim/* and design-fired/*; nothing else is written to the repository

jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - name: Bridge tick
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          # One routine token per teammate (bridge/designers.json names the secret). tools/add_designer.py adds a line.
          # routine-tokens: begin
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
          # routine-tokens: end
          GH_TOKEN: ${{ github.token }}
          DESIGN_BRIDGE_FIRING: ${{ vars.DESIGN_BRIDGE_FIRING }}
          DRY: ${{ inputs.mode != 'live' && '--dry-run' || '' }}
        run: python3 -I bridge/bridge.py tick $DRY
